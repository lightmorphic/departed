<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Departed{% endblock %}</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%23fbc711'/%3E%3Cpath d='M12 7v5l3 3' stroke='%23645007' stroke-width='2.2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v={{ app_version }}">
</head>
<body>
<header class="top">
  <a class="brand" href="/" aria-label="Departed, home">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    <span>Departed</span>
  </a>
  <div class="top-actions">
    {% if user %}
    <nav class="topnav" aria-label="Main">
      <a href="/" {% if nav == 'home' %}aria-current="page"{% endif %}>Dashboard</a>
      <a href="/settings" {% if nav == 'settings' %}aria-current="page"{% endif %}>Settings</a>
      {% if user.is_admin %}<a href="/people" {% if nav == 'people' %}aria-current="page"{% endif %}>People</a>{% endif %}
    </nav>
    <span class="whoami">{{ user.username }}</span>
    <form method="post" action="/logout" class="inline"><button class="btn small" type="submit">Sign out</button></form>
    {% endif %}
    <div id="all-apps"></div>
  </div>
</header>
<main class="page">
{% block content %}{% endblock %}
</main>
<footer class="foot">Departed {{ app_version }}</footer>
<script src="https://apps.lightmorphic.com/launcher.js" defer></script>
<script>
(function(){
/* Destructive buttons ask a second time in place rather than in a dialog. */
document.addEventListener('click', function (e) {
  var b = e.target.closest('button[data-confirm]');
  if (!b) return;
  if (b.dataset.armed) return;
  e.preventDefault();
  var was = b.textContent;
  b.dataset.armed = '1';
  b.classList.add('confirming');
  b.textContent = 'Sure?';
  b.title = b.dataset.confirm;
  setTimeout(function () {
    delete b.dataset.armed;
    b.classList.remove('confirming');
    b.textContent = was;
  }, 4000);
}, true);
})();
</script>
</body>
</html>
