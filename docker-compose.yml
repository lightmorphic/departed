# Nothing in here is a setting. Email addresses, the mail server, the timing and
# your files all live inside the app, on its settings page.
services:
  departed:
    image: ghcr.io/lightmorphic/departed:latest
    container_name: departed
    restart: unless-stopped
    ports:
      - "${DEPARTED_PORT:-4160}:8080"
    volumes:
      - ${DEPARTED_DATA:-/opt/departed}:/data
